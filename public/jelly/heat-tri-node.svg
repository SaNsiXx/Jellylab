<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512"><title>heat tri-node jelly</title>
  <defs>
    <g id="j-geo"><circle cx="256" cy="162" r="78"/><circle cx="174" cy="304" r="78"/><circle cx="338" cy="304" r="78"/></g>
    <linearGradient id="j-body" gradientUnits="userSpaceOnUse" x1="96" y1="96" x2="416" y2="416">
      <stop offset="0" stop-color="#FFD25A"/><stop offset=".5" stop-color="#FF9A31"/><stop offset="1" stop-color="#FF4D5E"/>
    </linearGradient>
    <radialGradient id="j-core" gradientUnits="userSpaceOnUse" cx="270" cy="276" r="190">
      <stop offset="0" stop-color="#07080D" stop-opacity=".55"/><stop offset=".65" stop-color="#07080D" stop-opacity=".12"/><stop offset="1" stop-color="#07080D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="j-caustic" gradientUnits="userSpaceOnUse" cx="330" cy="340" r="150">
      <stop offset="0" stop-color="#FFD25A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD25A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="j-rim" gradientUnits="userSpaceOnUse" x1="96" y1="96" x2="416" y2="416">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#FFD25A" stop-opacity=".55"/><stop offset="1" stop-color="#FF4D5E" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="j-spec"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="j-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="j-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <mask id="j-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <use href="#j-geo" fill="#fff"/>
    </mask>
  </defs>
  <use href="#j-geo" fill="#FF9A31"  filter="url(#j-blur)" opacity="0.5"/>
  <use href="#j-geo" fill="url(#j-body)"  opacity=".92"/>
  <g mask="url(#j-mask)">
    <rect width="512" height="512" fill="url(#j-core)"/>
    <rect width="512" height="512" fill="url(#j-caustic)"/>
    
    <ellipse cx="230" cy="126" rx="30" ry="14" transform="rotate(-30 230 126)" fill="url(#j-spec)" opacity=".8" filter="url(#j-soft)"/><ellipse cx="216.5" cy="127.4" rx="5" ry="4.48" transform="rotate(-30 230 126)" fill="#fff" opacity=".9"/><ellipse cx="148" cy="270" rx="30" ry="14" transform="rotate(-30 148 270)" fill="url(#j-spec)" opacity=".8" filter="url(#j-soft)"/><ellipse cx="134.5" cy="271.4" rx="5" ry="4.48" transform="rotate(-30 148 270)" fill="#fff" opacity=".9"/><ellipse cx="312" cy="270" rx="30" ry="14" transform="rotate(-30 312 270)" fill="url(#j-spec)" opacity=".8" filter="url(#j-soft)"/><ellipse cx="298.5" cy="271.4" rx="5" ry="4.48" transform="rotate(-30 312 270)" fill="#fff" opacity=".9"/>
  </g>
  <use href="#j-geo" fill="none" stroke="url(#j-rim)" stroke-width="4"/></svg>
